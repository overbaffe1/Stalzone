name: CI — tests + EAPI smoke

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    # Reads Secrets from BOTH repo level and the `Stalzone_config` environment
    # (Settings -> Environments -> Stalzone_config -> Secrets).
    environment: Stalzone_config
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          set -eo pipefail
          mkdir -p fetched_info
          python3 -m pytest tests/ -v 2>&1 | tee fetched_info/ci_run.log

      - name: Live smoke test (public demo API, no secrets)
        run: |
          set -eo pipefail
          python3 tools/smoke_eapi.py 2>&1 | tee -a fetched_info/ci_run.log

      - name: Live smoke test (production EAPI, needs Secrets)
        env:
          # Accept both naming styles (repo OR environment Secrets):
          STALCRAFT_CLIENT_ID: ${{ secrets.STALCRAFT_CLIENT_ID || secrets.STALZONE_CLIENT_ID }}
          STALCRAFT_CLIENT_SECRET: ${{ secrets.STALCRAFT_CLIENT_SECRET || secrets.STALZONE_CLIENT_SECRET }}
          STALCRAFT_REGION: ${{ secrets.STALCRAFT_REGION || secrets.STALZONE_REGION }}
          # ...or a single multi-line STALZONE_CONFIG secret with all three:
          STALZONE_CONFIG: ${{ secrets.STALZONE_CONFIG }}
          # Safe diagnostics: booleans only, never values:
          _HAS_CRAFT_ID: ${{ secrets.STALCRAFT_CLIENT_ID != '' }}
          _HAS_ZONE_ID: ${{ secrets.STALZONE_CLIENT_ID != '' }}
          _HAS_BLOB: ${{ secrets.STALZONE_CONFIG != '' }}
        run: |
          set -eo pipefail
          echo "secret visibility: STALCRAFT_*=${_HAS_CRAFT_ID}, STALZONE_*=${_HAS_ZONE_ID}, BLOB=${_HAS_BLOB}" | tee -a fetched_info/ci_run.log
          python3 tools/smoke_prod.py 2>&1 | tee -a fetched_info/ci_run.log

      - name: Live market research (opt-in via [research] in commit message)
        # Trigger: push a commit whose message contains "[research]" (full
        # ~1000-item scan, ~30 min) or "[research:N]" (first N items, smoke).
        if: contains(github.event.head_commit.message, '[research')
        env:
          STALCRAFT_CLIENT_ID: ${{ secrets.STALCRAFT_CLIENT_ID || secrets.STALZONE_CLIENT_ID }}
          STALCRAFT_CLIENT_SECRET: ${{ secrets.STALCRAFT_CLIENT_SECRET || secrets.STALZONE_CLIENT_SECRET }}
          STALCRAFT_REGION: ${{ secrets.STALCRAFT_REGION || secrets.STALZONE_REGION }}
          STALZONE_CONFIG: ${{ secrets.STALZONE_CONFIG }}
          MARKET_DB: fetched_info/research.db
          RESEARCH_MIN_SALES: "10"
          RESEARCH_TOP: "60"
        run: |
          set -eo pipefail
          MSG="${{ github.event.head_commit.message }}"
          N="$(printf '%s' "$MSG" | grep -o '\[research:[0-9][0-9]*\]' | grep -o '[0-9][0-9]*' | head -1)"
          export RESEARCH_MAX_ITEMS="${N:-0}"
          echo "research scope: MAX_ITEMS=$RESEARCH_MAX_ITEMS (0 = full scan)"
          python3 tools/market_research.py 2>&1 | tee fetched_info/research_run.log

      - name: Commit and push results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fetched_info/
          git diff --cached --quiet || (git commit -m "ci: update test log and EAPI smoke reports [skip ci]" && git push origin HEAD:${GITHUB_REF_NAME})
